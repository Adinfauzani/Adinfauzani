<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">Combined GitHub Analytics</title>
  <desc id="desc">Combined public GitHub analytics for Adinfauzani, Rynexid, and Sorakuid. The first scheduled workflow will populate live statistics.</desc>
  <rect width="1000" height="510" rx="18" fill="#242933"/>
  <rect x="1" y="1" width="998" height="508" rx="17" fill="none" stroke="#434c5e"/>
  <text x="48" y="58" fill="#eceff4" font-family="Arial,sans-serif" font-size="24" font-weight="700">GitHub Analytics</text>
  <text x="48" y="84" fill="#8994a6" font-family="Arial,sans-serif" font-size="12">ADINFAUZANI + RYNEXID + SORAKUID</text>
  <rect x="48" y="126" width="904" height="112" rx="14" fill="#2e3440" stroke="#434c5e"/>
  <text x="500" y="172" fill="#eceff4" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Combined analytics is being initialized</text>
  <text x="500" y="201" fill="#aeb9ca" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">The first GitHub Actions run will replace this placeholder with live statistics.</text>
  <text x="48" y="286" fill="#eceff4" font-family="Arial,sans-serif" font-size="14" font-weight="700">SOURCES</text>
  <g font-family="Arial,sans-serif" font-size="13" fill="#d8dee9">
    <circle cx="56" cy="324" r="5" fill="#88c0d0"/><text x="72" y="329">Adinfauzani — Personal account</text>
    <circle cx="56" cy="360" r="5" fill="#a3be8c"/><text x="72" y="365">Rynexid — Organization</text>
    <circle cx="56" cy="396" r="5" fill="#ebcb8b"/><text x="72" y="401">Sorakuid — Organization</text>
  </g>
  <text x="952" y="486" fill="#687386" font-family="Arial,sans-serif" font-size="10" text-anchor="end">Nord Dark · Automated with GitHub Actions</text>
</svg>